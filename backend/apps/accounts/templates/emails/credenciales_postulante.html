<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Postulación aprobada</title>
  </head>
  <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <h1>¡Felicidades, {{ nombre }}!</h1>
    <p>Tu postulación a <strong>{{ puesto }}</strong> pasó el filtro inicial. El siguiente paso es una entrevista técnica con nuestro entrevistador de IA.</p>
    <p>Usá estas credenciales para ingresar:</p>
    <p>
      Usuario: <strong>{{ username }}</strong><br />
      Contraseña temporal: <strong>{{ password_temporal }}</strong>
    </p>
  </body>
</html>
