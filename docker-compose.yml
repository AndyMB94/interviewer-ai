services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewer_ai
      POSTGRES_USER: interviewer_ai
      POSTGRES_PASSWORD: interviewer_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - ./backend/staticfiles:/app/staticfiles
    depends_on:
      - postgres
      - redis

  celery-worker:
    build: ./backend
    command: celery -A config worker --loglevel=info
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      - postgres
      - redis

  ws-gateway:
    build: ./ws-gateway
    restart: unless-stopped
    environment:
      DJANGO_URL: http://backend:8000
      REDIS_URL: redis://redis:6379
      PUBLIC_DJANGO_URL: ${PUBLIC_DJANGO_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - ws-gateway

volumes:
  postgres_data:
  media_data: